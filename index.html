to! Unsa imong gusto?`,english:`Good noon! What would you like?`},{speaker:`Mark`,bisaya:`Maayong udto. Naa ba kay manok?`,english:`Good noon. Do you have chicken?`},{speaker:`Manang Lita`,bisaya:`Naa. Gusto ka ug kan-on?`,english:`Yes. Do you want rice?`},{speaker:`Mark`,bisaya:`Oo, palihug. Duha ka kan-on.`,english:`Yes, please. Two portions of rice.`},{speaker:`Manang Lita`,bisaya:`Sige. Gusto ka ug tubig?`,english:`Okay. Do you want water?`},{speaker:`Mark`,bisaya:`Oo, palihug. Pila tanan?`,english:`Yes, please. How much altogether?`},{speaker:`Manang Lita`,bisaya:`Singkwenta pesos.`,english:`Fifty pesos.`},{speaker:`Mark`,bisaya:`Salamat kaayo! Lami gyud.`,english:`Thank you very much! So delicious.`}],verified:!1},{id:`tricycle-ride`,title:`A tricycle ride`,setting:`Ana flags down a tricycle to go to the church.`,lines:[{speaker:`Ana`,bisaya:`Kuya, moadto ko sa simbahan.`,english:`Kuya, I'm going to the church.`},{speaker:`Drayber`,bisaya:`Sige, sakay na.`,english:`Okay, hop in.`},{speaker:`Ana`,bisaya:`Pila ang pamasahe?`,english:`How much is the fare?`},{speaker:`Drayber`,bisaya:`Baynte pesos.`,english:`Twenty pesos.`},{speaker:`Ana`,bisaya:`Sige. Hinay-hinay lang, Kuya.`,english:`Okay. Slowly, please, Kuya.`},{speaker:`Drayber`,bisaya:`Okay.`,english:`Okay.`},{speaker:`Ana`,bisaya:`Diri lang, Kuya. Salamat!`,english:`Here is fine, Kuya. Thanks!`}],verified:!1},{id:`at-the-market`,title:`At the market`,setting:`Rosa buys mangoes from a vendor.`,lines:[{speaker:`Rosa`,bisaya:`Manang, pila ni?`,english:`Manang, how much is this?`},{speaker:`Manang Cora`,bisaya:`Singkwenta ang usa ka kilo.`,english:`Fifty for one kilo.`},{speaker:`Rosa`,bisaya:`Mahal kaayo. Matawaran ba?`,english:`That's very expensive. Can you lower it?`},{speaker:`Manang Cora`,bisaya:`Sige, kwarenta na lang.`,english:`Okay, just forty.`},{speaker:`Rosa`,bisaya:`Sige, duha ka kilo.`,english:`Okay, two kilos.`},{speaker:`Manang Cora`,bisaya:`Otsenta pesos tanan.`,english:`Eighty pesos in total. license":"CC BY 2.0 FR","verified":false},{"bisaya":"Dili kinaiyanhon ang makaluksaw nga ulan.","english":"Acid rain is not a natural phenomenon.","id":4650846,"author":"Josefwintzent","english_id":245182,"english_author":"CM","license":"CC BY 2.0 FR","verified":false}],"unsa":[{"bisaya":"Unsa nang nagasaba-saba?","english":"What's all this noise about?","id":14008412,"author":"stoopeedhooman","english_id":66295,"english_author":"CM","license":"CC BY 2.0 FR","verified":false},{"bisaya":"Wala na ko masayod unsa pay buhaton.","english":"I don't know what to do anymore.","id":4629775,"author":"Josefwintzent","english_id":1443,"english_author":"Zifre","license":"CC BY 2.0 FR","verified":false},{"bisaya":"Unsa kaha kung sayop siya?","english":"What if he's wrong?","id":11335140,"author":"zmah47jr","english_id":1801653,"english_author":"Spamster","license":"CC BY 2.0 FR","verified":false}],"usa":[{"bisaya":"Tagai kog usa bi.","english":"Please give me one.","id":4693716,"author":"Josefwintzent","english_id":4695216,"english_author":"Josefwintzent","license":"CC BY 2.0 FR","verified":false},{"bisaya":"Usa na lang ka tugahala ang makaluwas kanato.","english":"Just one more miracle will be able to save us.","id":4696302,"author":"tarsier","english_id":14037091,"english_author":"stoopeedhooman","license":"CC BY 2.0 FR","verified":false},{"bisaya":"Sulayon nako magbiyahe ug usa lang ka maleta.","english":"I try to travel with only one suitcase.","id":14061595,"author":"stoopeedhooman","english_id":3260390,"english_author":"CM","license":"CC BY 2.0 FR","verified":false}],"walo":[{"bisaya":"Nagsakay ang kap-atag walo ka tripulante.","english":"Forty-eight sailors are on board.","id":4636509,"author":"Josefwintzent","english_id":1492979,"english_author":"CM","license":"CC BY 2.0 FR","verified":false}]}`)},p=JSON.parse(`[{"id":"glottal-stop","title":"Pronunciation: the glottal stop","summary":"Cebuano has a tiny catch in the throat that English speakers tend to skip. It is part of the word, so learn it from the start.","points":["The glottal stop is a brief closing of the throat. You already make it in English \\"uh-oh\\": the little catch in the middle is the glottal stop.","Cebuano writes it with a hyphen when it falls between a consonant and a vowel: tan-aw (look), kan-on (rice), kanus-a (when), sud-an (food eaten with rice). Say the part before the hyphen, catch, then the part after it.","It also occurs where nothing is written: between two vowels, as in ma-a-yo (maayo) and ga-bi-i (gabii), and at the end of some words. For these you have to learn it by listening.","Skipping it sounds wrong to a Cebuano ear, and in some words it is the only thing that tells two words apart.","To practise: say \\"uh-oh\\" slowly, then say \\"tan-aw\\" the same way, with a clean stop after the n and no sliding into the a. Then speed up gradually, and record yourself to compare.","Honest note: the audio in this app is machine-generated and may not reproduce the glottal stop reliably. A native speaker, or the linked video, is the better model."],"examples":[{"bisaya":"Tan-aw","english":"Look / watch","note":"Stop after the n: tan (catch) aw."},{"bisaya":"Kan-on","english":"Cooked rice","note":"Stop after the n: kan (catch) on."},{"bisaya":"Sud-an","english":"Food eaten with rice","note":"Stop after the d: sud (catch) an."},{"bisaya":"Kanus-a","english":"When","note":"Stop after the s: ka-nus (catch) a."},{"bisaya":"Gabii","english":"Night / evening","note":"No hyphen is written, but there is a stop between the two i's: ga-bi-i."}],"quiz":[{"question":"How does Cebuano usually write a glottal stop between a consonant and a vowel?","options":["With a hyphen, as in tan-aw","With a double letter, as in tannaw","With an accent mark, as in tanáw"],"answer":0,"explain":"A hyphen marks the stop: tan-aw, kan-on, sud-an."},{"question":"Which word has a glottal stop between its last two letters, even though none is written?","options":["Gabii","Lami","Salamat"],"answer":0,"explain":"Gabii is said ga-bi-i, with a catch between the two i's."},{"question":"How should you say the hyphen in \\"kan-on\\"?","options":["Stop the air briefly in the throat, like the catch in \\"uh-oh\\"","Hold the n for a long time","Ignore it and say \\"kanon\\""],"answer":0,"explain":"The hyphen stands for a short catch in the throat, not a longer n and not a silent letter."}],"verified":false},{"id":"markers","title":"Markers: ang, si, sa, ni, ug","summary":"Small words in front of nouns tell you the role of the noun. Learn these five and most sentences start to make sense.","points":["\\"Ang\\" marks the thing the sentence is about (the topic), like \\"the\\": Nindot ang balay (The house is nice).","\\"Si\\" does the same job for a person's name or a title: Si Ana (Ana), Si Kuya (Kuya).","\\"Sa\\" marks places, directions and ownership by a thing or a general person: sa balay (at/to the house), ang libro sa bata (the child's book).","\\"Ni\\" is the \\"sa\\" of names: ang libro ni Ana (Ana's book). To or from a named person you use \\"kang\\": gihatag kang Ana.","\\"Ug\\" marks a general, non-specific object (\\"a / some\\") and also means \\"and\\": Mokaon ko ug isda (I will eat fish); isda ug kan-on (fish and rice)."],"examples":[{"bisaya":"Nindot ang balay.","english":"The house is nice.","note":""},{"bisaya":"Naa si Ana sa balay.","english":"Ana is at home.","note":"\\"Naa\\" means \\"is there / has\\"."},{"bisaya":"Ang libro ni Ana.","english":"Ana's book.","note":""},{"bisaya":"Mokaon ko ug isda.","english":"I will eat fish.","note":"\\"Ug\\" can become \\"og\\" in some speakers."},{"bisaya":"Isda ug kan-on.","english":"Fish and rice.","note":""}],"quiz":[{"question":"Complete: ___ Pedro naa sa balay. (Pedro is home.)","options":["Si","Ni","Sa"],"answer":0,"explain":"\\"Si\\" goes before a name that is the subject. \\"Ni\\" would mean \\"of Pedro\\"."},{"question":"Complete: Ang kan-on ___ Ana. (Ana's rice.)","options":["si","ni","ug"],"answer":1,"explain":"\\"Ni\\" shows that something belongs to a named person."},{"question":"Complete: Mokaon ko ___ isda. (I will eat fish.)","options":["ug","ang","sa"],"answer":0,"explain":"\\"Ug\\" marks a general object. \\"Ang\\" would make it a specific topic."}],"verified":false},{"id":"pronouns","title":"Pronouns: ko, ka, siya, kita, kami","summary":"Cebuano has short forms you will hear all day (ko, ka, ta) and full forms for emphasis. It also separates \\"we including you\\" from \\"we without you\\".","points":["I: \\"ako\\" (full) and \\"ko\\" (short). You (one person): \\"ikaw\\" and \\"ka\\". He or she: \\"siya\\" (no gender).","In normal speech the short forms follow another word: Gutom ko (I'm hungry), Kumusta ka? (How are you?). Use the full forms to start a sentence or stress the person: Ako ni.","Two kinds of \\"we\\": \\"kita\\" (short \\"ta\\") includes the person you talk to; \\"kami\\" leaves them out.","You (more than one person) is \\"kamo\\" (short \\"mo\\"). They is \\"sila\\".","Tip: when you invite someone, use \\"ta\\": Kaon ta! (Let's eat!). When you tell someone what your group is doing, use \\"kami\\".","Do not copy English word order: say \\"Mokaon ko\\" (will eat, I), not \\"Ako mokaon\\", because the short pronoun ko or ka comes right after the first word of the sentence, whether that is a verb, wala, dili or a question word."],"examples":[{"bisaya":"Gutom ko.","english":"I'm hungry.","note":""},{"bisaya":"Kumusta ka?","english":"How are you?","note":""},{"bisaya":"Moadto kami sa merkado.","english":"We (not you) are going to the market.","note":""},{"bisaya":"Adto ta sa simbahan.","english":"Let's go (you and I) to the church.","note":""},{"bisaya":"Naa sila sa balay.","english":"They are at home.","note":""}],"quiz":[{"question":"Which word means \\"we\\" including the person you are talking to?","options":["kami","kita","sila"],"answer":1,"explain":"\\"Kita\\" (short \\"ta\\") includes the listener. \\"Kami\\" excludes them."},{"question":"What is the short form of \\"ikaw\\"?","options":["ko","ka","ta"],"answer":1,"explain":"\\"Ka\\" is the short form of \\"ikaw\\". \\"Ko\\" is short for \\"ako\\"."},{"question":"How do you say \\"you\\" for a group of people?","options":["kamo","siya","ikaw"],"answer":0,"explain":"\\"Kamo\\" is the plural \\"you\\"."}],"verified":false,"drills":[{"type":"order","english":"I will eat.","answer":["Mokaon","ko"],"extra":["ako"],"alternatives":[],"explain":"The short pronoun ko follows the verb; \\"ako\\" is the long form for emphasis."},{"type":"order","english":"You will go.","answer":["Moadto","ka"],"extra":["ikaw"],"alternatives":[],"explain":"The short pronoun ka comes right after the verb."},{"type":"order","english":"I'm hungry.","answer":["Gutom","ko"],"extra":["ako"],"alternatives":[],"explain":"ko follows the first word of the predicate, here the describing word gutom."},{"type":"order","english":"I will go tomorrow.","answer":["Moadto","ko","ugma"],"extra":[],"alternatives":[],"explain":"ko comes right after the verb; the time word ugma goes after it."},{"type":"order","english":"I don't understand.","answer":["Wala","ko","kasabot"],"extra":["ako"],"alternatives":[],"explain":"After a negator like wala, ko comes straight after it, before the verb."},{"type":"order","english":"Where are you going?","answer":["Asa","ka","padulong"],"extra":["ikaw"],"alternatives":[],"explain":"After a question word such as asa, ka follows immediately."},{"type":"order","english":"When will you arrive?","answer":["Kanus-a","ka","moabot"],"extra":[],"alternatives":[],"explain":"The question word kanus-a comes first, then ka, then the verb."},{"type":"order","english":"I won't eat fish.","answer":["Dili","ko","mokaon","ug","isda"],"extra":["ako"],"alternatives":[],"explain":"ko goes right after dili; the object with ug comes last."}]},{"id":"possessives","title":"Possessives: akong, imong, iyang","summary":"To say \\"my house\\" or \\"your name\\" you put a possessive in front of the noun, or put a short form after it.","points":["Before the noun: akong (my), imong (your), iyang (his / her), among (our, without you), atong (our, with you), inyong (your, plural), ilang (their).","They end in -ng because they join to the noun: akong balay, imong ngalan.","Spoken Cebuano often puts a different word after the noun instead: balay nako (my house), balay nimo (your house), balay niya, balay namo, balay nato, balay ninyo, balay nila.","Both patterns mean the same thing. \\"Atong\\" and \\"nato\\" include the listener; \\"among\\" and \\"namo\\" do not."],"examples":[{"bisaya":"Akong balay.","english":"My house.","note":""},{"bisaya":"Unsa imong ngalan?","english":"What is your name?","note":""},{"bisaya":"Iyang amahan.","english":"His / her father.","note":""},{"bisaya":"Among balay.","english":"Our house (not including you).","note":""},{"bisaya":"Atong higala.","english":"Our friend (including you).","note":""}],"quiz":[{"question":"How do you say \\"our friend\\" when you include the listener?","options":["among higala","atong higala","ilang higala"],"answer":1,"explain":"\\"Atong\\" is \\"our\\" including the listener."},{"question":"Complete the pattern with the noun first: balay ___ (my house)","options":["nako","akong","ako"],"answer":0,"explain":"After the noun, \\"my\\" is \\"nako\\"."},{"question":"Which word means \\"their\\"?","options":["inyong","ilang","iyang"],"answer":1,"explain":"\\"Ilang\\" is \\"their\\". \\"Inyong\\" is \\"your\\" (plural)."}],"verified":false},{"id":"aspect","title":"Verb aspect: mo-, ni-, nag-","summary":"Cebuano verbs change a small prefix to show when and how things happen, not a complex tense system. One root word can wear many prefixes.","points":["Take the root \\"kaon\\" (eat). \\"Mokaon\\" = will eat (it has not happened yet).","\\"Nikaon\\" (also \\"mikaon\\") = ate, finished action. Add \\"na\\" for \\"already\\": Nikaon na ko.","\\"Nagkaon\\" = is eating now, or eats habitually. It describes something in progress.","The pattern works for many verbs: moadto / niadto / nagadto, moinom / niinom / nag-inom.","Use \\"na\\" (already) and \\"pa\\" (still, yet): Nikaon na ko. Wala pa ko mokaon (I haven't eaten yet)."],"examples":[{"bisaya":"Mokaon ko ugma.","english":"I will eat tomorrow.","note":""},{"bisaya":"Nikaon na ko.","english":"I already ate.","note":"\\"Mikaon\\" is the same; \\"ni-\\" is very common in Cebu city speech."},{"bisaya":"Nagkaon siya karon.","english":"He / she is eating now.","note":""},{"bisaya":"Kada adlaw nagkaon mi ug kan-on.","english":"Every day we eat rice.","note":""}],"quiz":[{"question":"Which form means \\"I will eat tomorrow\\"?","options":["Mokaon ko ugma.","Nikaon ko ugma.","Nagkaon ko ugma."],"answer":0,"explain":"\\"Mo-\\" is for actions that have not happened yet."},{"question":"What does \\"Nikaon na ko\\" mean?","options":["I will eat","I already ate","I am eating"],"answer":1,"explain":"\\"Ni-\\" shows a finished action and \\"na\\" means \\"already\\"."},{"question":"What does \\"Nagkaon sila karon\\" mean?","options":["They ate","They will eat","They are eating"],"answer":2,"explain":"\\"Nag-\\" shows an action in progress."}],"verified":false},{"id":"questions-ba","title":"Questions and the particle \\"ba\\"","summary":"Question words go first. For yes-or-no questions you can just raise your voice, or add \\"ba\\" to sound more natural and polite.","points":["Question words: unsa (what), asa (where), kanus-a (when), kinsa (who), ngano (why), pila (how many / how much), giunsa (how).","They usually start the sentence: Unsa imong ngalan? Asa ka padulong?","For yes / no, say the sentence with a rising voice: Gutom ka? Add \\"ba\\" after the first word to ask politely: Gutom ka ba?","\\"Ba\\" never carries meaning by itself. It just marks a question: Naa ba kay sukli? (Do you have change?)","Answer with \\"Oo\\" (yes) or \\"Dili\\" (no)."],"examples":[{"bisaya":"Unsa imong ngalan?","english":"What is your name?","note":""},{"bisaya":"Asa ka padulong?","english":"Where are you going?","note":""},{"bisaya":"Gutom ka ba?","english":"Are you hungry?","note":""},{"bisaya":"Naa ba kay sukli?","english":"Do you have change?","note":""},{"bisaya":"Kinsa ni?","english":"Who is this?","note":""}],"quiz":[{"question":"Which word means \\"where\\"?","options":["unsa","asa","kinsa"],"answer":1,"explain":"\\"Asa\\" = where. \\"Unsa\\" = what. \\"Kinsa\\" = who."},{"question":"Complete: Gutom ka ___? (Are you hungry?)","options":["ba","ug","si"],"answer":0,"explain":"\\"Ba\\" marks a yes / no question."},{"question":"What does \\"ngano\\" mean?","options":["when","why","how"],"answer":1,"explain":"\\"Ngano\\" = why. \\"Kanus-a\\" = when. \\"Giunsa\\" = how."}],"verified":false},{"id":"negation","title":"Negation: dili and wala","summary":"English has \\"not\\", Cebuano has two words. Choose by the time or kind of sentence, not by the person.","points":["\\"Dili\\" negates things that have not happened or that are general facts: future actions, adjectives and nouns, and the answer \\"No\\".","\\"Wala\\" means \\"did not\\" for past actions, and \\"there is none / I have none\\": opposite of \\"naa\\".","\\"Wala pa\\" = not yet. \\"Dili na\\" = no longer, will not anymore.","To forbid something say \\"ayaw\\": Ayaw pagdali (Don't rush).","Compare: Dili ko mokaon (I will not eat) vs Wala ko mokaon (I did not eat)."],"examples":[{"bisaya":"Dili ko mokaon.","english":"I will not eat.","note":""},{"bisaya":"Wala ko mokaon.","english":"I did not eat.","note":""},{"bisaya":"Dili mahal.","english":"It is not expensive.","note":""},{"bisaya":"Wala koy kuwarta.","english":"I have no money.","note":"\\"Koy\\" is \\"ko\\" plus \\"ay\\", a spoken blend."},{"bisaya":"Wala pa ko mokaon.","english":"I haven't eaten yet.","note":""}],"quiz":[{"question":"How do you say \\"I will not go\\"?","options":["Dili ko moadto.","Wala ko moadto.","Ayaw ko moadto."],"answer":0,"explain":"\\"Dili\\" for something you will not do (future)."},{"question":"Which means \\"I have no money\\"?","options":["Dili koy kuwarta.","Wala koy kuwarta.","Ayaw koy kuwarta."],"answer":1,"explain":"\\"Wala\\" says something does not exist or is not there."},{"question":"How do you say \\"It is not expensive\\"?","options":["Wala mahal.","Ayaw mahal.","Dili mahal."],"answer":2,"explain":"Adjectives use \\"dili\\"."}],"verified":false}]`),m={palihug:{ipa:`/paˈlihuɡ/`,hyphenation:`pa-li-hug`,wiktionary_stress:`pa-LI-hug`,ours:`pa-LI-hug`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/palihug#Cebuano`,license:`CC BY-SA 4.0`,sense_matched:!1,gloss:`nonstandard spelling of palihog`},dili:{ipa:`/ˈdiliʔ/`,hyphenation:`di-li`,wiktionary_stress:null,ours:`DI-li`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/dili#Cebuano`,license:`CC BY-SA 4.0`,other_ipa:[`/ˈdiliʔ/`,`/diˈliʔ/`],ambiguous:!0,sense_matched:!1,gloss:`negates predicates; is not; will not; don't ever; to not like, want`},amping:{ipa:`/ˈʔampiŋ/`,hyphenation:null,wiktionary_stress:`AM-ping`,ours:`AM-ping`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/amping#Cebuano`,license:`CC BY-SA 4.0`,sense_matched:!1,gloss:`to be safe; to be careful; to be wary of one's surroundings`},babay:{ipa:`/baˈbaj/`,hyphenation:`ba-bay`,wiktionary_stress:null,ours:`ba-BAY`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/babay#Cebuano`,license:`CC BY-SA 4.0`,other_ipa:[`/baˈbaj/`,`/ˈbabaj/`],ambiguous:!0,sense_matched:!1,gloss:`eye dialect spelling of babaye`},usa:{ipa:`/ʔuˈsa/`,hyphenation:`u-sa`,wiktionary_stress:null,ours:`U-sa`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/usa#Cebuano`,license:`CC BY-SA 4.0`,other_ipa:[`/ʔuˈsa/`,`/ˈʔusa/`],ambiguous:!0,gloss:`one; 1`},duha:{ipa:`/duˈha/`,hyphenation:`du-ha`,wiktionary_stress:`du-HA`,ours:`DU-ha`,agrees:!1,source_url:`https://en.wiktionary.org/wiki/duha#Cebuano`,license:`CC BY-SA 4.0`,gloss:`two`},tulo:{ipa:`/tuˈlo/`,hyphenation:`tu-lo`,wiktionary_stress:`tu-LO`,ours:`TU-lo`,agrees:!1,source_url org/wiki/hatag#Cebuano`,license:`CC BY-SA 4.0`,gloss:`to give, to provide, to tender`},kuha:{ipa:`/ˈkuhaʔ/`,hyphenation:`ku-ha`,wiktionary_stress:`KU-ha`,ours:`KU-ha`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/kuha#Cebuano`,license:`CC BY-SA 4.0`,gloss:`to get; to take; to get; to take; to take away; to remove; to get; to take; to perform an `},trabaho:{ipa:`/tɾaˈbaho/`,hyphenation:`tra-ba-ho`,wiktionary_stress:`tra-BA-ho`,ours:`tra-BA-ho`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/trabaho#Cebuano`,license:`CC BY-SA 4.0`,gloss:`a work; an employment; a job; a chore`},luto:{ipa:`/ˈlutoʔ/`,hyphenation:`lu-to`,wiktionary_stress:`LU-to`,ours:`LU-to`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/luto#Cebuano`,license:`CC BY-SA 4.0`,gloss:`to cook`},lakaw:{ipa:`/laˈkaw/`,hyphenation:`la-kaw`,wiktionary_stress:`la-KAW`,ours:`la-KAW`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/lakaw#Cebuano`,license:`CC BY-SA 4.0`,gloss:`to walk; to go for a walk, especially to mosey or walk leisurely; to go out; to leave; to `},lingkod:{ipa:`/ˈliŋkod/`,hyphenation:`ling-kod`,wiktionary_stress:`LING-kod`,ours:`LING-kod`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/lingkod#Cebuano`,license:`CC BY-SA 4.0`,gloss:`to sit; to sit down; to assume; to take on a position, duty or any form of responsibility`},tindog:{ipa:`/ˈtindoɡ/`,hyphenation:`tin-dog`,wiktionary_stress:`TIN-dog`,ours:`tin-DOG`,agrees:!1,source_url:`https://en.wiktionary.org/wiki/tindog#Cebuano`,license:`CC BY-SA 4.0`,changed:!0,gloss:`to rise; to become erect; to assume an upright position; to arise; to come up from a lower`},ayaw:{ipa:`/ʔaˈjaw/`,hyphenation:`a-yaw`,wiktionary_stress:`a-YAW`,ours:`A-yaw`,agrees:!1,source_url:`https://en.wiktionary.org/wiki/ayaw#Cebuano`,license:`CC BY-SA 4.0`,gloss:`don't; stop`},unsa:{ipa:`/ˈʔunsa/`,hyphenation:`un-sa`,wiktionary_stress:null,ours:`UN-sa`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/unsa#Cebuano`,license:`CC BY-SA 4.0`,other_ipa:[`/ˈʔunsa/`,`/ʔunˈsa/`],ambiguous:!0,sense_matched:!1,gloss:`what; which`},asa:{ipa:`/ˈʔasa/`,hyphenation:`a-sa`,wiktionary_stress:`A-sa`,ours:`A-sa`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/asa#Cebuano`,license:`CC BY-SA 4.0`,gloss:`where`},kinsa:{ipa:`/ˈkinsa/`,hyphenation:`kin-sa`,wiktionary_stress:`KIN-sa`,ours:`KIN-sa`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/kinsa#Cebuano`,license:`CC BY-SA 4.0`,gloss:`who`},ngano:{ipa:`/ˈŋano/`,hyphenation:`nga-no`,wiktionary_stress:`NGA-no`,ours:`NGA-no`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/ngano#Cebuano`,license:`CC BY-SA 4.0`,gloss:`why`},pila:{ipa:`/piˈla/`,hyphenation:`pi-la`,wiktionary_stress:null,ours:`PI-la`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/pila#Cebuano`,license:`CC BY-SA 4.0`,other_ipa:[`/piˈla/`,`/ˈpila/`],ambiguous:!0,sense_matched:!1,gloss:`how many?`},giunsa:{ipa:`/ɡɪˈʊn.sa/`,hyphenation:`gi-un-sa`,wiktionary_stress:`gi-UN-sa`,ours:`gi-UN-sa`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/giunsa#Cebuano`,license:`CC BY-SA 4.0`,sense_matched:!1,gloss:`How (queries the exact manner, protocol, or mechanism by which a past action was completed`},bitaw:{ipa:`/ˈbitaw/`,hyphenation:`bi-taw`,wiktionary_stress:`BI-taw`,ours:`BI-taw`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/bitaw#Cebuano`,license:`CC BY-SA 4.0`,gloss:`indeed`},sige:{ipa:`/ˈsiɡe/`,hyphenation:`si-ge`,wiktionary_stress:`SI-ge`,ours:`SI-ge`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/sige#Cebuano`,license:`CC BY-SA 4.0`,sense_matched:!1,gloss:`always; OK`},diay:{ipa:`/diˈʔaj/`,hyphenation:`di-ay`,wiktionary_stress:`di-AY`,ours:`di-AY`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/diay#Cebuano`,license:`CC BY-SA 4.0`,sense_matched:!1,gloss:`indicates that the speaker has received new information, or realized something they were p`},day:{ipa:`/ˈdaj/`,hyphenation:`day`,wiktionary_stress:`DAY`,ours:`DAY`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/day#Cebuano`,license:`CC BY-SA 4.0`,gloss:`common term of address to a girl; common term of address to one's daughter`},unya:{ipa:`/ˈʔunjaʔ/`,hyphenation:`un-ya`,wiktionary_stress:`UN-ya`,ours:`UN-ya`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/unya#Cebuano`,license:`CC BY-SA 4.0`,gloss:`later`},daw:{ipa:`/ˈdaw/`,hyphenation:null,wiktionary_stress:`DAW`,ours:`DAW`,agrees:!0,source_url:`https://en.wiktionary.org/wiki/daw#Cebuano`,license:`CC BY-SA 4.0`,sense_matched:!1,gloss:`seem, like (before the relevant noun or adjective); rather (before the relevant verb); ind`}},h={routes:[{id:`southern`,name:`The southern road`,tagline:`From the tuna port of the south, up through the highlands.`,stops:[`general-santos`,`davao`,`bukidnon`,`cagayan-de-oro`,`camiguin`,`jagna`,`tagbilaran`,`cebu-city`]},{id:`western`,name:`The western sea road`,tagline:`From the far southwest, by island and strait, to Cebu.`,stops:[`tawi-tawi`,`zamboanga`,`dapitan`,`dumaguete`,`siquijor`,`carcar`,`cebu-city`]},{id:`eastern`,name:`The eastern road`,tagline:`From the surf of Siargao, across Leyte, to Cebu.`,stops:[`siargao`,`surigao-city`,`butuan`,`tacloban`,`bantayan`,`liloan`,`cebu-city`]}],places:[{id:`general-santos`,name:`General Santos City`,province:`South Cotabato`,island:`Mindanao`,lat:6.11,lon:125.17,fare:0,transport:`plane`,tagline:`The tuna port at the southern edge of Mindanao.`,description:`General Santos is a coastal city on Sarangani Bay in the far south of Mindanao. Its busy fish port is the heart of the city, and fishing boats come in with the day's catch.`,culture:`The city is widely known in the Philippines for tuna, and its fish is sent to markets across the country. People from many parts of the country have settled here, so the city mixes food and customs from the Visayas, Luzon and Mindanao.`,language:`Many languages are heard here, including Cebuano, Hiligaynon, Ilocano and the languages of local communities such as the Blaan. Filipino and English are widely understood, and your Cebuano will be understood by many people.`,treats:[`tuna`],verified:!1,learn:{categories:[`greetings`],lesson:`glottal-stop`,dialogue:`introducing-yourself`,gate:`pila-ang-pamasahe`}},{id:`davao`,name:`Davao City`,province:`Davao del Sur`,island:`Mindanao`,lat:7.07,lon:125.61,fare:80,transport:`bus`,tagline:`Mindanao's largest city, famous for its fruit.`,description:`Davao is the largest city in Mindanao, on the Davao Gulf, with Mount Apo, the highest mountain in the Philippines, in the region behind it. It is green, spread out and busy, with fruit stalls in many corners.`,culture:`Davao is well known for durian, pomelo and other tropical fruit, and the city holds a yearly festival, Kadayawan, to give thanks for the harvest and to celebrate the cultures of its peoples. The region is home to many indigenous communities as well as settlers from the Visayas.`,language:`Most people in Davao speak Cebuano, with some local words and a way of speaking that people call Davao Bisaya. Filipino and English are also widely used, so your Cebuano will carry you well.`,treats:[`durian`,`pomelo`],verified:!1,learn:{categories:[`food`],lesson:null,dialogue:`buying-fruit`,gate:`bayad-lang`}},{id:`bukidnon`,name:`Bukidnon`,province:`Bukidnon`,island:`Mindanao`,lat:8.16,lon:125.13,fare:150,transport:`bus`,tagline:`Cool highlands of farms, ranches and pineapple.`,description:`Bukidnon is an inland province on a high plateau in Northern Mindanao, with the town of Malaybalay as its capital. The air is cooler than on the coast, and wide fields of pineapple, corn and sugar cane spread across the hills.`,culture:`Bukidnon is the homeland of indigenous peoples such as the Talaandig, Higaonon and Bukidnon, and the province holds the Kaamulan festival in Malaybalay, a gathering that celebrates their culture. It is also known for pineapple plantations and cattle ranches.`,language:`Most people in Bukidnon speak Cebuano today. Indigenous communities also speak their own languages, such as Binukid and Talaandig, which are separate languages. Your Cebuano will carry you well in towns.`,treats:[`pineapple`],verified:!1,learn:{categories:[`describing`,`weather`],lesson:`markers`,dialogue:null,gate:`para-lang`}},{id:`cagayan-de-oro`,name:`Cagayan de Oro City`,province:`Misamis Oriental`,island:`Mindanao`,lat:8.48,lon:124.65,fare:200,transport:`bus`,tagline:`The river city on the north coast of Mindanao.`,description:`Cagayan de Oro lies on Macajalar Bay on Mindanao's north coast, where the Cagayan River reaches the sea. It is a busy city and a gateway to the highlands of Bukidnon.`,culture:`The city is known as a place for white-water rafting on the river, and for its yearly Higalaay festival, named with the Cebuano word for friend. People here often call themselves Kagay-anon, after the river.`,language:`Most people in Cagayan de Oro speak Cebuano, so what you have learned here is the everyday language of the city. Filipino and English are also widely used.`,treats:[`corn-grits`],verified:!1,learn:{categories:[`transport`],lesson:null,dialogue:`tricycle-ride`,gate:`diri-lang`}},{id:`camiguin`,name:`Camiguin`,province:`Camiguin`,island:`Camiguin`,lat:9.25,lon:124.72,fare:300,transport:`ferry`,tagline:`A small island of volcanoes, springs and lanzones.`,description:`Camiguin is a small island off the north coast of Mindanao. Its seven volcanoes rise straight from the sea, and the road around the island is short enough to ride in a day.`,culture:`The island is known for its hot and cold springs and for lanzones, the sweet fruit it celebrates with a yearly Lanzones Festival. Camiguin is also known for pastel, the soft bread rolls that visitors take home as pasalubong.`,language:`People on Camiguin mostly speak Cebuano, sometimes called Camiguin Bisaya, with small differences in words and tune. Your Cebuano will carry you well here.`,treats:[`lanzones`,`pastel`],verified:!1,learn:{categories:[`numbers`],lesson:`pronouns`,dialogue:null,gate:`lugar-lang`}},{id:`jagna`,name:`Jagna`,province:`Bohol`,island:`Bohol`,lat:9.65,lon:124.37,fare:400,transport:`ferry`,tagline:`A small Bohol port town on the south coast.`,description:`Jagna is a town on the southeast coast of Bohol, with a port, a market and a waterfront. It is quieter than Tagbilaran and a good stop for seeing daily life in the province.`,culture:`Jagna is known in Bohol for kalamay, a sticky sweet sold in coconut shells, and for its fiesta traditions. Travellers who pass through often buy kalamay at the market to take home as pasalubong.`,language:`People in Bohol speak Boholano, a variety of Cebuano, with some local words and a gentle tune of its own. Your Cebuano will carry you well here.`,treats:[`kalamay`],verified:!1,learn:{categories:[`market-money`],lesson:`possessives`,dialogue:`at-the-market`,gate:`pila-tanan`}},{id:`tagbilaran`,name:`Tagbilaran City`,province:`Bohol`,island:`Bohol`,lat:9.65,lon:123.85,fare:300,transport:`van`,tagline:`The capital of Bohol, on the island's southwest coast.`,description:`Tagbilaran is the main city and port of Bohol, facing Cebu across the Bohol Strait. It is a small city with markets, churches and a busy waterfront where ferries come and go.`,culture:`Bohol is known for the Chocolate Hills, tarsiers and old coral-stone churches such as the one in nearby Baclayon. Visitors go home with peanut kisses, broas and other sweets from the island as pasalubong.`,language:`Most people in Bohol speak Boholano, a variety of Cebuano. Your Cebuano will be understood, and people will enjoy hearing you try.`,treats:[`peanut-kisses`,`broas`],verified:!1,learn:{categories:[`directions`],lesson:`questions-ba`,dialogue:`asking-directions`,gate:`asa-ka-padulong`}},{id:`tawi-tawi`,name:`Bongao`,province:`Tawi-Tawi`,island:`Bongao Island`,lat:5.03,lon:119.77,fare:0,transport:`plane`,tagline:`The far southwest, where the Philippines meets the sea.`,description:`Bongao is the main town of Tawi-Tawi, the southernmost province of the Philippines, a chain of islands near the border with Malaysia. A mountain called Bud Bongao rises over the town and can be seen from the water.`,culture:`Tawi-Tawi is home to Sama communities, whose life has long centred on the sea, and to Tausug and other peoples. Seaweed farming and fishing are important to local families, and boats are part of everyday travel between the islands.`,language:`Most people speak Sinama, the language of the Sama, and Tausug, with Filipino and English used in schools and offices. Cebuano is not the main language here, though some people will understand a little.`,treats:[`seaweed`],verified:!1,learn:{categories:[`greetings`],lesson:`glottal-stop`,dialogue:`introducing-yourself`,gate:`pila-ang-pamasahe`}},{id:`zamboanga`,name:`Zamboanga City`,province:`Zamboanga Peninsula`,island:`Mindanao`,lat:6.91,lon:122.07,fare:250,transport:`ferry`,tagline:`The city where Chavacano is spoken.`,description:`Zamboanga City sits at the tip of the Zamboanga Peninsula in southwest Mindanao. It has a long waterfront, an old stone fort called Fort Pilar, and a busy port.`,culture:`Zamboanga is known for Chavacano, a language that grew from Spanish and local languages, and for the colourful sails of the vinta boats of the Sama people. The city's food mixes Spanish, Sama, Tausug and Visayan influences.`,language:`Most people in Zamboanga speak Chavacano, a creole language with Spanish words. Cebuano is also widely understood, and Tausug, Sama, Subanen and Filipino are heard too, so your Cebuano will still help.`,treats:[`satti`,`curacha`],verified:!1,learn:{categories:[`food`,`numbers`],lesson:null,dialogue:`ordering-carinderia`,gate:`bayad-lang`}},{id:`dapitan`,name:`Dapitan City`,province:`Zamboanga del Norte`,island:`Mindanao`,lat:8.66,lon:123.42,fare:250,transport:`bus`,tagline:`The town where Jose Rizal lived in exile.`,description:`Dapitan is a coastal city in Zamboanga del Norte, on the north side of the Zamboanga Peninsula. It has a long seafront, a church and a plaza, and farmland behind the town.`,culture:`Dapitan is where the national hero Jose Rizal was sent in exile and lived from 1892 to 1896, working as a doctor, teacher and farmer. Many visitors come to see the Rizal Shrine and the park by the sea.`,language:`Most people in Dapitan speak Cebuano, and Subanen communities live in the hills of the province, with their own language. Your Cebuano will carry you well here.`,treats:[`banana-cue`],verified:!1,learn:{categories:[`family`,`time-days`],lesson:`possessives`,dialogue:`greeting-neighbour`,gate:`para-lang`}},{id:`dumaguete`,name:`Dumaguete City`,province:`Negros Oriental`,island:`Negros Island`,lat:9.31,lon:123.31,fare:350,transport:`ferry`,tagline:`The city of gentle people, by the sea.`,description:`Dumaguete is the capital of Negros Oriental, on the southeast coast of Negros. It has a long seaside boulevard where people stroll in the evening, and it faces the island of Siquijor.`,culture:`The city is known as a university town, home to Silliman University, and students come from many provinces. It is also known for sweets such as budbud kabog and silvanas that visitors take home as pasalubong.`,language:`Most people in Dumaguete speak Cebuano, and Filipino and English are widely used in the city. Your Cebuano will carry you well here.`,treats:[`budbud-kabog`,`silvanas`],verified:!1,learn:{categories:[`questions`,`directions`],lesson:`questions-ba`,dialogue:`asking-directions`,gate:`diri-lang`}},{id:`siquijor`,name:`Siquijor`,province:`Siquijor`,island:`Siquijor`,lat:9.21,lon:123.51,fare:200,transport:`ferry`,tagline:`A small island of beaches and old stone churches.`,description:`Siquijor is a small island province south of Cebu and Bohol, with a ring road that runs along the coast. It has white beaches, waterfalls, old stone churches and an old balete tree.`,culture:`Island life on Siquijor revolves around fishing, farming and the fiestas of its parish towns, and old churches such as the one in Lazi are part of the landscape. Many visitors come for the quiet beaches and the friendly pace of life.`,language:`People on Siquijor speak Cebuano as their first language, in a variety that is sometimes called Siquijodnon. Your Cebuano will carry you well here.`,treats:[`binignit`],verified:!1,learn:{categories:[`feelings`],lesson:`negation`,dialogue:null,gate:`lugar-lang`}},{id:`carcar`,name:`Carcar City`,province:`Cebu`,island:`Cebu`,lat:10.11,lon:123.64,fare:450,transport:`ferry`,tagline:`A heritage town on the road south from Cebu City.`,description:`Carcar is a city in southern Cebu, about forty kilometres from Cebu City, on the main road to the south. It has a busy market, a rotunda in the centre and old houses built a century ago.`,culture:`Carcar is known for its heritage houses and church, and for chicharon, the crisp fried pork skin that travellers buy on the way. Many food stalls here sell sweets and snacks as pasalubong.`,language:`Most people in Carcar speak Cebuano as their first language. This is the language the app teaches, in the form heard in Cebu.`,treats:[`chicharon`,`otap`],verified:!1,learn:{categories:[`market-money`,`transport`],lesson:`markers`,dialogue:`at-the-market`,gate:`pila-tanan`}},{id:`siargao`,name:`General Luna`,province:`Surigao del Norte`,island:`Siargao`,lat:9.79,lon:126.16,fare:0,transport:`plane`,tagline:`A surf island at the eastern edge of Mindanao.`,description:`Siargao is an island off the northeast coast of Mindanao, facing the Pacific Ocean. General Luna is its main tourist town, with a long beach, surf breaks and coconut groves.`,culture:`Siargao is known for surfing, and for the coconut palms that cover much of the island. Fishing and coconut farming have long supported island families, and many young people now work in the tourism that surfing brought.`,language:`People on Siargao speak Surigaonon and Cebuano, and Filipino and English are widely used with visitors. Surigaonon is a language of its own, and your Cebuano will carry you a long way.`,treats:[`buko`],verified:!1,learn:{categories:[`greetings`,`weather`],lesson:`glottal-stop`,dialogue:`greeting-neighbour`,gate:`pila-ang-pamasahe`}},{id:`surigao-city`,name:`Surigao City`,province:`Surigao del Norte`,island:`Mindanao`,lat:9.79,lon:125.49,fare:250,transport:`ferry`,tagline:`The port town where ferries leave for Siargao and Leyte.`,description:`Surigao City lies at the northeast tip of Mindanao, facing the islands of the Surigao Strait. It is a port town, with fishing boats, ferries and a busy market.`,culture:`The city is the gateway to the islands of Surigao del Norte and to Leyte across the water. Its people are known for fishing, and the seafood at the market comes straight from the boats.`,language:`Most people in Surigao speak Surigaonon, a language of its own related to Cebuano, and many also speak Cebuano. With your Cebuano you will be understood, though some words will sound new.`,treats:[`kinilaw`],verified:!1,learn:{categories:[`transport`],lesson:`markers`,dialogue:`tricycle-ride`,gate:`bayad-lang`}},{id:`butuan`,name:`Butuan City`,province:`Agusan del Norte`,island:`Mindanao`,lat:8.95,lon:125.54,fare:150,transport:`bus`,tagline:`A river city with a long story of trade by water.`,description:`Butuan is a city on the Agusan River in northeast Mindanao, a few kilometres from the sea. It is the main city of the Caraga region, with a busy market and a museum.`,culture:`Archaeologists have found old wooden boats, called balanghai, buried near Butuan, and the city is known for its long history as a trading place on the river. The Agusan valley also grows rice, fruit and marang.`,language:`Most people in Butuan speak Cebuano, and Butuanon, a language of its own, is spoken by many local families. Your Cebuano will carry you well, and Filipino and English are widely used.`,treats:[`marang`],verified:!1,learn:{categories:[`numbers`,`numbers-big`],lesson:`aspect`,dialogue:null,gate:`para-lang`}},{id:`tacloban`,name:`Tacloban City`,province:`Leyte`,island:`Leyte`,lat:11.24,lon:125,fare:400,transport:`bus`,tagline:`The main city of Leyte, on the eastern Visayas.`,description:`Tacloban is the largest city in Eastern Visayas, on the northeast coast of Leyte beside San Pedro Bay. The long San Juanico Bridge links Leyte to the island of Samar.`,culture:`Tacloban is the home of Waray culture and the centre of the region. It is known for its sweets such as moron and binagol, which travellers take home as pasalubong, and for its parish fiestas.`,language:`Most people in Tacloban speak Waray, which is a separate language from Cebuano, though the two share many words. Cebuano is spoken in parts of southern and western Leyte, and many people understand some.`,treats:[`moron`,`binagol`],verified:!1,learn:{categories:[`verbs`],lesson:`pronouns`,dialogue:`ordering-carinderia`,gate:`diri-lang`}},{id:`bantayan`,name:`Bantayan`,province:`Cebu`,island:`Bantayan Island`,lat:11.17,lon:123.72,fare:500,transport:`ferry`,tagline:`A fishing island off the north of Cebu.`,description:`Bantayan is an island off the north coast of Cebu, reached by boat. It has white beaches, small towns, windmills and a fish market where the day's catch is sold.`,culture:`Bantayan is known for fishing and dried fish, and families here have lived by the sea for generations. Dried fish and other snacks from the island are common pasalubong.`,language:`Most people on Bantayan speak Cebuano, and some speak Bantayanon, a Visayan language of its own. Your Cebuano will carry you well here.`,treats:[`danggit`,`puso`],verified:!1,learn:{categories:[`food`,`getting-around`],lesson:`questions-ba`,dialogue:`buying-fruit`,gate:`lugar-lang`}},{id:`liloan`,name:`Liloan`,province:`Cebu`,island:`Cebu`,lat:10.4,lon:123.99,fare:300,transport:`bus`,tagline:`A town north of Cebu City, known for rosquillos.`,description:`Liloan is a coastal town in northern Cebu, about twenty kilometres from Cebu City, on the road that runs along the east coast. Its roadside shops are busy with travellers.`,culture:`Liloan is known for rosquillos, the round, crisp biscuits that families bake and sell in tins. Many Cebuanos stop here on the way home to buy a box as pasalubong.`,language:`Most people in Liloan speak Cebuano as their first language. This is the language the app teaches, in the form heard in Cebu.`,treats:[`rosquillos`,`sikwate`],verified:!1,learn:{categories:[`directions`,`market-money`],lesson:`possessives`,dialogue:`asking-directions`,gate:`pila-tanan`}},{id:`cebu-city`,name:`Cebu City`,province:`Cebu`,island:`Cebu`,lat:10.32,lon:123.89,fare:300,transport:`bus`,tagline:`The end of the road: the Queen City of the South.`,description:`Cebu City is the main city of the Visayas, on the east coast of Cebu Island facing Mactan. It is busy, with markets, churches, malls, and a port where ferries arrive from across the islands.`,culture:`Cebu is home to the Basilica del Santo Nino and to the Sinulog festival, held every January to honour the Santo Nino. It is also where Magellan's Cross stands, and where lechon, dried mangoes and many pasalubong are bought.`,language:`Cebuano is the first language of most people in Cebu City, and it is the Cebuano this app teaches. Filipino and English are also widely used. You have arrived at the language's home.`,treats:[`lechon`,`dried-mangoes`],verified:!1,learn:{categories:[`polite-fillers`],lesson:`negation`,dialogue:`inviting-for-a-drink`,gate:null}}]},g=t({default:()=>_}),_=JSON.parse(`[{"number":"2329","title":"Ang Gugmang Gibati Ko","artist":"Visayan Song","youtubeId":"Y5pBzV9CInE","lang":"bisaya"},{"number":"2450","title":"Ay Hab Tu Hands","artist":"Max Surban","youtubeId":"8CAe-6eRNjM","lang":"bisaya"},{"number":"2536","title":"Baleleng","artist":"Max Surban","youtubeId":"xHhygNvYrdA","lang":"bisaya"},{"number":"2688","title":"Binilanggo sa Paghigugma","artist":"Del Horest","youtubeId":"Dxw9ET02aNE","lang":"bisaya"},{"number":"2695","title":"Bisan Ang Kalibutan Magdumili","artist":"Del Hor duration:`1:05`,kind:`Conversation`,blurb:`Buying fruit: asking the price, quantities and the total, with English translation.`,related:{tab:`dialogues`,label:`Practise the buying fruit dialogue`}},{id:`BShOV8oIsis`,title:`Bisaya/Cebuano Conversation: Meeting Someone & Inviting Them for Drinks 14 (English Translation)`,channel:`Cebuano (Bisaya) with Ares & Sirena`,url:`https://www.youtube.com/watch?v=BShOV8oIsis`,duration:`0:48`,kind:`Conversation`,blurb:`A short greeting, introduction and invitation, with English translation.`,related:{tab:`dialogues`,label:`Practise inviting someone for a drink`}},{id:`KzbPtGk8m74`,title:`100 Bisaya Words You Need To Know`,channel:`Bisaya4Kids by Mama AMOR`,url:`https://www.youtube.com/watch?v=KzbPtGk8m74`,duration:`13:40`,kind:`Vocabulary`,blurb:`A picture-led list of everyday words, made for children and beginners.`,related:{tab:`flashcards`,label:`Review your own cards`}},{id:`DOD9WJTVhdY`,title:`21 Common Bisaya Words You Need To Know`,channel:`Bisaya4Kids by Mama AMOR`,url:`https://www.youtube.com/watch?v=DOD9WJTVhdY`,duration:`3:52`,kind:`Vocabulary`,blurb:`A quick list of common words in the same picture-led format.`,related:{tab:`flashcards`,label:`Review your own cards`}}],b=JSON.parse(`[{"id":"tuna","name":"Tuna","local_name":"","kind":"savoury","place":"General Santos","region":"Mindanao","place_id":"general-santos","price":150,"tagline":"Fresh tuna from the fishing port of the south.","description":"Tuna is a large, firm, red-fleshed ocean fish. In General Santos it is sold fresh at the fish port and cooked in many ways: grilled, fried, in soup, or raw as sashimi or kinilaw.","culture":"General Santos is widely known in the Philippines as a tuna city, and its fish goes to markets across the country. A grilled tuna jaw or belly shared with rice is a typical meal for a family or a group of friends.","words":["isda","kan-on"],"verified":false},{"id":"durian","name":"Durian","local_name":"","kind":"fruit","place":"Davao","region":"Davao Region","place_id":"davao","price":200,"tagline":"Davao's famous fruit, rich, creamy and strong.","description":"Durian is a large green fruit covered in spikes. Inside are creamy yellow pods around big seeds. The flesh is rich, sweet and custard-like, and its smell is strong.","culture":"Davao is well known for durian, and the fruit is a point of local pride. People usually open one together and share the pods with friends and family, often at a fruit stand.","words":["lami"],"verified":false},{"id":"pomelo","name":"Pomelo","local_name":"Suha","kind":"fruit","place":"Davao","region":"Davao Region","place_id":"davao","price":80,"tagline":"A giant citrus with sweet, juicy segments.","description":"Pomelo is the largest of the citrus fruits, with a thick green or yellow rind and pale pink or yellow segments inside. It is juicy, sweet and a little sour. People peel away the bitter skin around each segment before eating.","culture":"Davao is known for growing it. Families peel it and pass the segments around the table as a light dessert. Many families also set out round fruits at New Year, and pomelo is one of them.","words":["lami"],"verified":false},{"id":"pineapple","name":"Pineapple","local_name":"","kind":"fruit","place":"Bukidnon","region":"Northern Mindanao","place_id":"bukidnon","price":60,"tagline":"Sweet pineapple from the highland plantations.","description":"Pineapple is a golden fruit with a tough, spiky skin and juicy flesh that is sweet with a little sourness. In Bukidnon it grows on large farms on the cool highland plateau.","culture":"Bukidnon is known for its pineapple plantations, and the fruit is eaten fresh, canned or as juice around the country. Families buy it at roadside stalls and slice it as a cool dessert after a meal.","words":["lami"],"verified":false},{"id":"corn-grits","name":"Corn grits","local_name":"Mais","kind":"savoury","place":"Cagayan de Oro","region":"Northern Mindanao","place_id":"cagayan-de-oro","price":20,"tagline":"Ground corn cooked like rice, a staple of the south.","description":"Corn grits are dried corn kernels ground into small pieces and cooked in water until soft. The result looks a little like rice and has a mild, slightly sweet taste.","culture":"In parts of the Visayas and Mindanao, corn has long been eaten in place of rice or mixed with it. Northern Mindanao, with Bukidnon behind it, is a big corn-growing area, and grits are served as kan-on with fish or a vegetable dish.","words":["kan-on","sud-an"],"verified":false},{"id":"lanzones","name":"Lanzones","local_name":"","kind":"fruit","place":"Camiguin","region":"Northern Mindanao","place_id":"camiguin","price":90,"tagline":"Small pale fruit with sweet, juicy segments.","description":"Lanzones grow in bunches. Each fruit has a thin, pale yellow skin that you peel to find soft, translucent segments, sweet with a touch of sourness. Some segments hold a bitter seed, so people usually do not chew it.","culture":"Camiguin, an island in Northern Mindanao, is well known for lanzones and holds a Lanzones Festival to celebrate the harvest. In season, families buy them by the bunch and share them with guests.","words":["lami"],"verified":false},{"id":"pastel","name":"Pastel","local_name":"","kind":"sweet","place":"Camiguin","region":"Northern Mindanao","place_id":"camiguin","price":100,"tagline":"Soft bread rolls with sweet custard inside.","description":"Pastel is a soft bread roll filled with yema, a sweet custard made from egg yolk and milk. The bread is light and pillowy and the filling is smooth and quite sweet.","culture":"Pastel is closely linked with Camiguin. Bakeries on the island sell it in boxes, and visitors take them home as pasalubong. It goes well with coffee at merienda.","words":["lami"],"verified":false},{"id":"kalamay","name":"Kalamay","local_name":"","kind":"sweet","place":"Jagna","region":"Central Visayas","place_id":"jagna","price":60,"tagline":"A sticky coconut sweet sold in a coconut shell.","description":"Kalamay is a thick, sticky sweet made from glutinous rice, coconut milk and brown sugar. In Bohol it is often sold packed in half a coconut shell with the top smoothed flat. It is very sweet and chewy.","culture":"Jagna, a town in Bohol, is known for it, and travellers take it home as pasalubong. People eat it in small pieces, often at merienda, and the coconut shell makes it easy to carry and to share.","words":[],"verified":false},{"id":"peanut-kisses","name":"Peanut kisses","local_name":"","kind":"sweet","place":"Tagbilaran","region":"Central Visayas","place_id":"tagbilaran","price":60,"tagline":"Light peanut sweets in twists of paper.","description":"Peanut kisses are small, pale, cone-shaped sweets made from egg white, sugar and ground peanuts and baked until dry and crisp. Each one is wrapped in a twist of paper. They are sweet and light.","culture":"Bohol is known for them, and they are sold in bags at shops and stops around the island. They are a typical pasalubong, small and light enough to share with a whole family or office.","words":["lami"],"verified":false},{"id":"broas","name":"Broas","local_name":"","kind":"sweet","place":"Baclayon","region":"Central Visayas","place_id":"tagbilaran","price":70,"tagline":"Light finger biscuits from Baclayon.","description":"Broas are long, light, dry biscuits made with flour, eggs and sugar. They are crisp, crumble easily and are not very sweet.","culture":"Baclayon, a town beside Tagbilaran in Bohol, is known for them, and they are sold in boxes as pasalubong. People dip them in coffee or hot chocolate at merienda so they soften.","words":["lami"],"verified":false},{"id":"seaweed","name":"Seaweed salad","local_name":"","kind":"savoury","place":"Bongao","region":"Mindanao","place_id":"tawi-tawi","price":30,"tagline":"Fresh seaweed from the farms of Tawi-Tawi.","description":"Edible seaweed is a sea plant with thin fronds or tiny green beads. It is rinsed and eaten fresh with vinegar, onion and tomato. It is crunchy, salty and a little sour.","culture":"Seaweed farming is an important livelihood in Tawi-Tawi, where families grow it in the shallow sea around the islands. A seaweed salad is a simple side dish with grilled fish and rice in coastal homes of the south.","words":["isda"],"verified":false},{"id":"satti","name":"Satti","local_name":"","kind":"savoury","place":"Zamboanga City","region":"Mindanao","place_id":"zamboanga","price":60,"tagline":"Grilled skewers with a spicy sauce and rice cakes.","description":"Satti is a dish of small grilled skewers of meat, usually chicken or beef, served with a warm, spicy sauce and small rice cakes. The meat is tender and the sauce is rich and a little sweet.","culture":"Satti is a street food and breakfast dish in Zamboanga, and it is linked with the Sama and Tausug communities of the south. People eat it at small stalls, dipping the skewers and rice cakes in the sauce by hand.","words":["kan-on"],"verified":false},{"id":"curacha","name":"Curacha","local_name":"Spanner crab","kind":"savoury","place":"Zamboanga City","region":"Mindanao","place_id":"zamboanga","price":400,"tagline":"A red flat crab with sweet meat.","description":"Curacha is a reddish crab with a flat body and soft, sweet meat. In Zamboanga it is cooked in spicy coconut milk or in a thick, buttery sauce.","culture":"Curacha is closely linked with Zamboanga, where restaurants serve it for special meals and family celebrations. It is eaten with the hands, with plenty of rice to go with the sauce.","words":["kan-on"],"verified":false},{"id":"banana-cue","name":"Banana cue","local_name":"","kind":"sweet","place":"Visayas","region":"Visayas and Mindanao","place_id":"dapitan","price":15,"tagline":"Fried saba banana in a shiny sugar coat.","description":"Banana cue is saba banana, a short, firm cooking banana, deep fried and coated in brown sugar until the sugar turns into a glossy caramel. It is sold on a bamboo stick. The outside is crisp and sticky and the inside is soft and sweet.","culture":"It is a classic street merienda, sold from carts near schools, markets and bus stops. It is cheap enough for anyone to buy, and it is a familiar afternoon treat for many people.","words":["lami"],"verified":false},{"id":"budbud-kabog","name":"Budbud kabog","local_name":"","kind":"sweet","place":"Dumaguete","region":"Negros Island","place_id":"dumaguete","price":25,"tagline":"Sticky millet cake wrapped in banana leaf.","description":"Budbud kabog is a sweet cake made from kabog, which is millet, a small grain, cooked with coconut milk and sugar and wrapped in banana leaf. It is soft, dense and slightly sticky.","culture":"Dumaguete, in Negros Oriental, is known for it. Many people eat budbud for breakfast or merienda with a cup of hot chocolate, and travellers take it home as pasalubong.","words":[],"verified":false},{"id":"silvanas","name":"Silvanas","local_name":"","kind":"sweet","place":"Dumaguete","region":"Negros Island","place_id":"dumaguete","price":180,"tagline":"A frozen cookie sandwich with buttercream.","description":"A silvana is a frozen dessert of two crisp cashew meringue wafers with buttercream between them, rolled in crumbs. It is sweet, creamy and crunchy, and it is kept in the freezer until you eat it.","culture":"Silvanas are a Dumaguete favourite, sold in shops and bakeries in boxes. Visitors to Negros Oriental often carry a box home as pasalubong and eat the biscuits cold, straight from the freezer.","words":["lami"],"verified":false},{"id":"binignit","name":"Binignit","local_name":"","kind":"sweet","place":"Visayas","region":"Visayas and Mindanao","place_id":"siquijor","price":30,"tagline":"A warm, sweet stew of fruit and root crops.","description":"Binignit is a thick, sweet stew cooked in coconut milk with root crops such as sweet potato and taro, plus saba banana, sago pearls and sticky rice. It is served warm, like a pudding, and tastes creamy and sweet.","culture":"Binignit is closely associated with Holy Week in the Visayas, when many families cook a big pot and share bowls with neighbours and relatives. It is also eaten as an ordinary merienda at other times of the year.","words":["init"],"verified":false},{"id":"chicharon","name":"Chicharon","local_name":"","kind":"savoury","place":"Carcar","region":"Central Visayas","place_id":"carcar","price":100,"tagline":"Crackling pork skin from Carcar.","description":"Chicharon is pork skin fried until it puffs up and turns crisp and golden. It is salty and crunchy, and it is sold in paper bags and plastic packs. Carcar, a city in southern Cebu, is known for it.","culture":"Travellers often stop in Carcar to buy chicharon as pasalubong. At home it is eaten as a snack, with spiced vinegar to dip, or beside rice as part of a meal.","words":["sud-an"],"verified":false},{"id":"otap","name":"Otap","local_name":"","kind":"sweet","place":"Cebu","region":"Central Visayas","place_id":"carcar","price":60,"tagline":"A flat, flaky biscuit, crisp and sweet.","description":"Otap is an oval, flaky pastry with a light coating of sugar. It is crisp, thin and sweet, and it is usually sold in a pack of several pieces.","culture":"Otap is a popular pasalubong from Cebu. Families keep a pack at home to eat with coffee at merienda, the afternoon snack, or to share when visitors drop by.","words":["lami"],"verified":false},{"id":"lechon","name":"Lechon","local_name":"","kind":"savoury","place":"Cebu","region":"Central Visayas","place_id":"cebu-city","price":500,"tagline":"Roast pig, the centre of a Cebu celebration.","description":"Lechon is a whole pig roasted over charcoal on a spit until the skin turns brown and crackles. Cebu lechon is known for being seasoned inside with herbs such as lemongrass and spring onion, so it is often eaten with little or no sauce.","culture":"Lechon is the main dish at fiestas, weddings, birthdays and Christmas gatherings. When it arrives the whole family gathers around it, and the meat is shared so that guests can take some home.","words":["baboy","kan-on"],"verified":false},{"id":"dried-mangoes","name":"Dried mangoes","local_name":"","kind":"fruit","place":"Cebu","region":"Central Visayas","place_id":"cebu-city","price":150,"tagline":"Sweet, chewy slices to take home from Cebu.","description":"Dried mangoes are slices of ripe mango that have been dried until they turn soft, chewy and deep orange. They taste sweet with a little sourness, and they are sold in flat packs and boxes.","culture":"Cebu is well known for them, and you will see them at the airport and in pasalubong shops. Pasalubong means a gift you bring home for family and friends after a trip, and a box of dried mangoes is a very common one.","words":["lami"],"verified":false},{"id":"buko","name":"Buko","local_name":"","kind":"drink","place":"Siargao","region":"Mindanao","place_id":"siargao","price":30,"tagline":"Cool water and soft meat from a young coconut.","description":"Buko is a young coconut. The clear water inside is cool and lightly sweet, and the soft, jelly-like meat can be scooped out with a spoon.","culture":"Coconut palms cover much of Siargao, and many island families have long depended on coconut farming. Vendors chop a young coconut open at the roadside and you drink straight from it, usually on a hot day.","words":["tubig"],"verified":false},{"id":"kinilaw","name":"Kinilaw","local_name":"","kind":"savoury","place":"Surigao City","region":"Visayas and Mindanao","place_id":"surigao-city","price":120,"tagline":"Raw fish cured in vinegar, ginger and chilli.","description":"Kinilaw is fresh raw fish cured in vinegar or citrus with ginger, onion and chilli. It is sour, fresh and a little spicy, and it must be made from fish caught that day.","culture":"Kinilaw is eaten across the Visayas and Mindanao, especially in coastal towns, as a starter or as a dish to share over drinks. In port towns like Surigao it is made from the day's catch.","words":["isda","lami"],"verified":false},{"id":"marang","name":"Marang","local_name":"","kind":"fruit","place":"Butuan","region":"Mindanao","place_id":"butuan","price":80,"tagline":"A fragrant fruit with soft white flesh.","description":"Marang is a round green fruit with soft spines. Inside are creamy white segments around seeds. The flesh is sweet and soft, and the fruit has a strong, sweet fragrance.","culture":"Marang is a fruit of Mindanao. Families eat it fresh when it is in season, scooping the segments out by hand, and fruit stalls in Agusan and Davao sell it alongside other local fruit.","words":["lami"],"verified":false},{"id":"moron","name":"Moron","local_name":"","kind":"sweet","place":"Leyte","region":"Eastern Visayas","place_id":"tacloban","price":30,"tagline":"Chocolate sticky rice in a banana leaf roll.","description":"Moron is a sweet snack of glutinous rice mixed with chocolate and coconut milk, wrapped in banana leaf and cooked. It is soft, chewy and tastes of chocolate.","culture":"Moron is a familiar merienda in Leyte, sold at markets and stalls, and it is often given as pasalubong. Many people eat it with a cup of coffee or hot chocolate.","words":["lami"],"verified":false},{"id":"binagol","name":"Binagol","local_name":"","kind":"sweet","place":"Leyte","region":"Eastern Visayas","place_id":"tacloban","price":120,"tagline":"Sweet taro cooked inside a coconut shell.","description":"Binagol is a sweet made from mashed taro, called gabi, with sugar and coconut milk. It is cooked in a hollowed coconut shell lined with banana leaf. The result is dense, smooth and very sweet.","culture":"Binagol is known as a sweet from Leyte, and a few shells in a bag make a typical pasalubong. People scoop it out of the shell in small spoonfuls to share.","words":[],"verified":false},{"id":"danggit","name":"Danggit","local_name":"","kind":"savoury","place":"Cebu","region":"Central Visayas","place_id":"bantayan","price":120,"tagline":"Dried rabbitfish, a salty gift from the sea.","description":"Danggit is a small rabbitfish that is split, salted and dried in the sun. It is fried until crisp and has a salty, savoury taste. It is sold in packs.","culture":"Danggit is a classic pasalubong from Cebu. At home it is fried and eaten with rice and a dip of spiced vinegar, often at breakfast.","words":["isda","kan-on"],"verified":false},{"id":"puso","name":"Puso","local_name":"","kind":"savoury","place":"Cebu","region":"Central Visayas","place_id":"bantayan","price":10,"tagline":"Rice cooked in a woven pouch of coconut leaf.","description":"Puso, sometimes called hanging rice, is rice wrapped in a small pouch woven from young coconut leaves and boiled until it sets into a firm triangle or diamond. At stalls the pouches often hang in bunches.","culture":"Puso is eaten with grilled meat and fish, especially at roadside barbecue stalls, and you unwrap it with your hands. It is cheap, easy to carry and goes with any sud-an, the dish eaten with rice.","words":["kan-on","sud-an"],"verified":false},{"id":"rosquillos","name":"Rosquillos","local_name":"","kind":"sweet","place":"Liloan","region":"Central Visayas","place_id":"liloan","price":80,"tagline":"Round, rich biscuits from Liloan.","description":"Rosquillos are small, round, crisp biscuits made with flour, egg yolks and sugar. They are golden, snap when you bite and taste sweet and rich.","culture":"Liloan, a town north of Cebu City, is known for them, and shops there sell them in tins and boxes for visitors. They are a typical pasalubong and an everyday companion to coffee or hot chocolate.","words":["lami"],"verified":false},{"id":"sikwate","name":"Sikwate","local_name":"","kind":"drink","place":"Cebu","region":"Central Visayas","place_id":"liloan","price":40,"tagline":"Thick hot chocolate made from local cacao.","description":"Sikwate is a hot chocolate drink made from tablea, small discs of ground roasted cacao, melted in hot water or milk. It is dark, rich and not very sweet unless sugar is added.","culture":"Many families drink sikwate at breakfast or in   <div class="app" id="app" data-tab="flashcards">
    <div id="learner">
      <nav class="dock-wrap" aria-label="Sections">
        <div class="dock" role="tablist" aria-label="Sections" id="tablist"></div>
      </nav>

      <header class="topbar">
        <h1 class="brand" id="brand">Bai<span class="brand-bai">!</span><span class="brand-sr"> Learn Bisaya</span></h1>

          <fieldset class="segmented" aria-label="Colour theme" id="theme-switch">
            <label><input type="radio" name="scheme" value="auto">Auto</label>
            <label><input type="radio" name="scheme" value="light">Light</label>
            <label><input type="radio" name="scheme" value="dark">Dark</label>

      </header>

      <section class="stats" id="stats" aria-label="Your progress today"></section>

      <div class="filters" id="filters" role="radiogroup" aria-label="Category"></div>

      <main id="main"></main>
    </div>

    <div id="journey-root" hidden></div>

    <div class="toasts" id="toasts"></div>

    <footer class="app-footer">
      <p><strong>Bai!</strong> Learn Bisaya. Pronunciation hints show stressed syllables in capitals.</p>

    </footer>
  </div>
